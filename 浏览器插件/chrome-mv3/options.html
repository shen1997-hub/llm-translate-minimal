<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>极简翻译 设置</title>
<style>:root{--primary:#e91e63;--primary-hover:#d81b60;--bg:#f2f4f8;--card:#fff;--text:#333;--text-secondary:#999;--border:#eee;--danger:#e06c75}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif;font-size:14px}.container{max-width:640px;margin:0 auto;padding:24px 16px 48px}.header{align-items:center;gap:10px;margin-bottom:16px;display:flex}.header .logo{background:var(--primary);color:#fff;border-radius:9px;justify-content:center;align-items:center;width:32px;height:32px;font-size:15px;font-weight:700;display:flex}.header h1{font-size:18px;font-weight:600}.card{background:var(--card);border-radius:12px;margin-bottom:14px;padding:6px 18px 14px}.card h2{color:var(--text-secondary);padding:12px 0 4px;font-size:13px;font-weight:500}label{margin-top:10px;font-size:13.5px;font-weight:500;display:block}input,textarea,select{box-sizing:border-box;width:100%;color:var(--text);background:#fafbfc;border:1px solid #dde1e7;border-radius:8px;margin-top:5px;padding:9px 11px;font-family:inherit;font-size:13.5px}input:focus,textarea:focus,select:focus{border-color:var(--primary);outline:2px solid #f8bbd0}textarea{resize:vertical;min-height:76px}.row{gap:12px;display:flex}.row>div{flex:1}.pv-row{border-top:1px solid var(--border);align-items:center;gap:10px;padding:12px 0;display:flex}.pv-row:first-of-type{border-top:none}.pv-info{flex:1;min-width:0}.pv-name{font-size:14px;font-weight:600}.pv-sub{color:var(--text-secondary);text-overflow:ellipsis;white-space:nowrap;margin-top:2px;font-size:12.5px;overflow:hidden}.pv-badge{color:var(--primary);border:1px solid var(--primary);border-radius:6px;flex:none;padding:1px 6px;font-size:11px}.pv-actions{flex:none;gap:6px;display:flex}.btn-text{color:var(--primary);cursor:pointer;background:0 0;border:none;border-radius:6px;padding:4px 6px;font-size:13px}.btn-text:hover{background:#fdeef4}.btn-text.danger{color:var(--danger)}.btn-text.danger:hover{background:#fdeeef}.pv-form{border-top:1px dashed var(--border);padding:4px 0 12px}.pv-form .form-actions{gap:10px;margin-top:12px;display:flex}.form-error{color:var(--danger);margin-top:8px;font-size:12.5px}#add-provider{width:100%;color:var(--text-secondary);cursor:pointer;background:0 0;border:1px dashed #ccd1d9;border-radius:8px;margin-top:12px;padding:9px;font-size:13.5px}#add-provider:hover{border-color:var(--primary);color:var(--primary)}#import-ccswitch{width:100%;color:var(--text-secondary);cursor:pointer;background:0 0;border:1px dashed #ccd1d9;border-radius:8px;margin-top:8px;padding:9px;font-size:13.5px}#import-ccswitch:hover{border-color:var(--primary);color:var(--primary)}.hint{color:var(--text-secondary);margin-top:6px;font-size:12px;line-height:1.5}.import-row{border-top:1px solid var(--border);align-items:center;gap:8px;padding:8px 0;font-weight:400;display:flex}.import-row input[type=checkbox]{flex:none;width:auto;margin:0}#import-list .btn-primary{margin-top:10px}#import-list .form-error{padding:8px 0}.empty-hint{color:var(--text-secondary);text-align:center;padding:14px 0;font-size:13px}.btn-primary{cursor:pointer;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:9px 22px;font-size:14px;font-weight:600}.btn-primary:hover{background:var(--primary-hover)}.btn-secondary{cursor:pointer;color:var(--text);background:#fff;border:1px solid #ccd1d9;border-radius:10px;padding:8px 16px;font-size:13.5px}.actions{align-items:center;gap:10px;margin-top:18px;display:flex}#status{color:#2a7;margin-left:auto;font-size:13px}</style>  <script type="module" crossorigin src="/chunks/options-ChTh6O8M.js"></script>
  <link rel="modulepreload" crossorigin href="/chunks/settings-bY5ayNrv.js">
</head>
<body>
  <div class="container">
    <div class="header"><div class="logo">译</div><h1>极简翻译 设置</h1></div>

    <div class="card">
      <h2>API 供应商</h2>
      <div id="provider-list"></div>
      <button id="add-provider">+ 添加供应商</button>
      <button id="import-ccswitch">从 CC Switch 导入</button>
      <div class="hint">CC Switch 数据库默认位于：Windows C:\Users\&lt;用户名&gt;\.cc-switch\cc-switch.db；macOS / Linux ~/.cc-switch/cc-switch.db</div>
      <input type="file" id="ccswitch-file" accept=".db" hidden>
      <div id="import-list"></div>
    </div>

    <div class="card">
      <h2>翻译偏好</h2>
      <label>系统提示词 <textarea id="systemPrompt"></textarea></label>
      <div class="row">
        <div><label>目标语言 <select id="targetLang"></select></label></div>
        <div><label>最短段落长度 <input id="minLength" type="number"></label></div>
        <div><label>中文占比阈值 <input id="cjkRatioThreshold" type="number" step="0.05" min="0" max="1"></label></div>
      </div>
    </div>

    <div class="card">
      <h2>站点管理</h2>
      <label>网站黑名单（每行一个域名）<textarea id="blacklist"></textarea></label>
    </div>

    <div class="actions">
      <button id="save" class="btn-primary">保存</button>
      <span id="status"></span>
    </div>
  </div>
</body>
</html>
