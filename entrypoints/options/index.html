<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>极简翻译 设置</title>
<style>
  :root {
    --brand: #e91e63;
    --brand-deep: #c2185b;
    --brand-tint: #fdeef4;
    --ink: #1f2328;
    --ink-2: #6a737d;
    --paper: #f7f8fa;
    --card: #ffffff;
    --line: #e4e7eb;
    --ok: #1a7f37;
    --danger: #c62828;
    --r-ctl: 8px;
    --r-box: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--paper); color: var(--ink); font-size: 14px;
  }
  :focus-visible { outline: 2px solid var(--brand-tint); outline-offset: 1px; }
  .container { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .header .logo {
    width: 32px; height: 32px; border-radius: var(--r-ctl); background: var(--brand);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
  }
  .header h1 { font-size: 19px; font-weight: 600; letter-spacing: 0.2px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-box);
    padding: 4px 18px 16px; margin-bottom: 14px;
  }
  .card h2 {
    font-size: 12px; font-weight: 600; color: var(--ink-2);
    padding: 14px 0 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px;
  }
  label { display: block; margin-top: 12px; font-size: 13.5px; font-weight: 500; }
  input, textarea, select {
    width: 100%; box-sizing: border-box; margin-top: 6px; padding: 0 11px; height: 34px;
    border: 1px solid var(--line); border-radius: var(--r-ctl); font-size: 13.5px;
    font-family: inherit; background: var(--card); color: var(--ink);
  }
  textarea { height: auto; min-height: 76px; padding: 8px 11px; resize: vertical; line-height: 1.6; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--brand-tint); border-color: var(--brand); }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }

  /* 供应商列表 */
  .pv-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .pv-row:first-of-type { border-top: none; }
  .pv-info { flex: 1; min-width: 0; }
  .pv-name { font-weight: 600; font-size: 14px; }
  .pv-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-badge {
    font-size: 11px; font-weight: 500; color: var(--brand-deep); background: var(--brand-tint);
    border-radius: 6px; padding: 2px 7px; flex: none;
  }
  .pv-actions { display: flex; gap: 6px; flex: none; }
  .btn-text {
    border: none; background: none; color: var(--brand-deep); font-size: 13px; cursor: pointer;
    padding: 4px 8px; border-radius: 6px; font-family: inherit;
  }
  .btn-text:hover { background: var(--brand-tint); }
  .btn-text.danger { color: var(--danger); }
  .btn-text.danger:hover { background: #fdecec; }
  .pv-form { border-top: 1px dashed var(--line); padding: 4px 0 12px; }
  .pv-form .form-actions { display: flex; gap: 10px; margin-top: 12px; }
  .form-error { color: var(--danger); font-size: 12.5px; margin-top: 8px; }
  #add-provider, #import-ccswitch {
    width: 100%; margin-top: 10px; height: 34px; border: 1px dashed #ccd1d9;
    border-radius: var(--r-ctl); background: none; color: var(--ink-2);
    font-size: 13.5px; font-family: inherit; cursor: pointer;
    transition: color 0.12s, border-color 0.12s;
  }
  #add-provider:hover, #import-ccswitch:hover { border-color: var(--brand); color: var(--brand-deep); }
  .hint { font-size: 12px; color: var(--ink-2); margin-top: 8px; line-height: 1.5; }
  .import-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-weight: 400; }
  .import-row input[type="checkbox"] { width: auto; height: auto; margin: 0; flex: none; }
  #import-list .btn-primary { margin-top: 10px; }
  #import-list .form-error { padding: 8px 0; }
  .empty-hint { padding: 14px 0; color: var(--ink-2); font-size: 13px; text-align: center; }

  .btn-primary {
    height: 36px; padding: 0 22px; border: none; border-radius: var(--r-ctl); cursor: pointer;
    background: var(--brand); color: #fff; font-size: 14px; font-weight: 600; font-family: inherit;
    transition: background 0.12s;
  }
  .btn-primary:hover { background: var(--brand-deep); }
  .btn-secondary {
    height: 34px; padding: 0 16px; border: 1px solid var(--line); border-radius: var(--r-ctl);
    cursor: pointer; background: var(--card); color: var(--ink); font-size: 13.5px; font-family: inherit;
  }
  .btn-secondary:hover { border-color: #ccd1d9; background: var(--paper); }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
  #status { margin-left: auto; font-size: 13px; color: var(--ok); }
</style></head>
<body>
  <div class="container">
    <div class="header"><div class="logo">译</div><h1>极简翻译 设置</h1></div>

    <div class="card">
      <h2>API 供应商</h2>
      <div id="provider-list"></div>
      <button id="add-provider">+ 添加供应商</button>
      <button id="import-ccswitch">从 CC Switch 导入</button>
      <div class="hint">CC Switch 数据库默认位于：Windows C:\Users\&lt;用户名&gt;\.cc-switch\cc-switch.db；macOS / Linux ~/.cc-switch/cc-switch.db</div>
      <input type="file" id="ccswitch-file" accept=".db" hidden>
      <div id="import-list"></div>
    </div>

    <div class="card">
      <h2>翻译偏好</h2>
      <label>系统提示词 <textarea id="systemPrompt"></textarea></label>
      <div class="row">
        <div><label>目标语言 <select id="targetLang"></select></label></div>
        <div><label>最短段落长度 <input id="minLength" type="number"></label></div>
        <div><label>中文占比阈值 <input id="cjkRatioThreshold" type="number" step="0.05" min="0" max="1"></label></div>
      </div>
    </div>

    <div class="card">
      <h2>站点管理</h2>
      <label>网站黑名单（每行一个域名）<textarea id="blacklist"></textarea></label>
    </div>

    <div class="actions">
      <button id="save" class="btn-primary">保存</button>
      <span id="status"></span>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
