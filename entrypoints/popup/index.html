<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<style>
  :root {
    --brand: #e91e63;
    --brand-deep: #c2185b;
    --brand-tint: #fdeef4;
    --ink: #1f2328;
    --ink-2: #6a737d;
    --paper: #f7f8fa;
    --card: #ffffff;
    --line: #e4e7eb;
    --ok: #1a7f37;
    --danger: #c62828;
    --r-ctl: 8px;
    --r-box: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    width: 320px; background: var(--paper); color: var(--ink); font-size: 14px;
  }
  :focus-visible { outline: 2px solid var(--brand-tint); outline-offset: 1px; }

  /* 首屏对照标本：产品在做的事本身 */
  .hero { padding: 16px 16px 14px; }
  .hero .pair {
    font-size: 12px; font-weight: 500; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .hero .specimen { margin-top: 8px; border-left: 2px solid var(--brand); padding-left: 10px; }
  .hero .src { color: var(--ink-2); font-size: 12.5px; line-height: 1.5; }
  .hero .dst { color: var(--ink); font-size: 15px; font-weight: 600; line-height: 1.5; margin-top: 2px; }

  /* 发丝线分组列表 */
  .group { padding: 2px 16px; background: var(--card); }
  .group + .group { border-top: 1px solid var(--line); }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 0; font-size: 13.5px;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .label { color: var(--ink-2); }
  .lang-select {
    width: 150px; max-width: 150px; height: 30px; padding: 0 8px; border: 1px solid var(--line);
    border-radius: var(--r-ctl); font-size: 13px; background: var(--card);
    color: var(--ink); font-family: inherit;
  }
  .lang-select:focus { border-color: var(--brand); outline: 2px solid var(--brand-tint); outline-offset: 0; }
  .lang-select:disabled { color: var(--ink-2); background: var(--paper); }
  .row .link { color: var(--brand-deep); font-size: 13px; cursor: pointer; text-decoration: none; }
  .row .link:hover { text-decoration: underline; }

  .switch { position: relative; width: 42px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; border-radius: 24px; background: #ccd1d9;
    transition: background 0.16s; cursor: pointer;
  }
  .slider::before {
    content: ""; position: absolute; width: 20px; height: 20px; left: 2px; top: 2px;
    border-radius: 50%; background: #fff; transition: transform 0.16s;
    box-shadow: 0 1px 2px rgba(31, 35, 40, 0.24);
  }
  .switch input:checked + .slider { background: var(--brand); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .switch input:focus-visible + .slider { outline: 2px solid var(--brand-tint); outline-offset: 2px; }

  #estimate, #progress, #message {
    font-size: 12.5px; line-height: 1.4; color: var(--ink-2);
    padding: 0 16px; margin-top: 8px; font-variant-numeric: tabular-nums;
  }
  #message.error { color: var(--danger); }

  .action-wrap { padding: 12px 16px 4px; }
  #action {
    width: 100%; height: 40px; border: none; border-radius: var(--r-ctl); cursor: pointer;
    background: var(--brand); color: #fff; font-size: 14.5px; font-weight: 600;
    font-family: inherit; transition: background 0.12s;
  }
  #action:hover { background: var(--brand-deep); }
  #action:disabled { background: var(--line); color: var(--ink-2); cursor: not-allowed; }

  .chips { padding: 2px 16px 8px; }
  .chip {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: none; border: none; border-radius: var(--r-ctl); padding: 9px 0;
    font-size: 13px; font-family: inherit; color: var(--ink-2); cursor: pointer;
    transition: color 0.12s, background 0.12s;
  }
  .chip:hover { color: var(--danger); background: var(--card); }

  .footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 12px; border-top: 1px solid var(--line);
    background: var(--card); font-size: 12px; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .footer a { color: var(--ink-2); text-decoration: none; display: flex; align-items: center; gap: 5px; }
  .footer a:hover { color: var(--ink); }
</style></head>
<body>
  <div class="hero">
    <div class="pair" id="hero-pair">自动检测 → 中文</div>
    <div class="specimen">
      <div class="src">Translate the page you are reading.</div>
      <div class="dst">翻译你正在阅读的页面。</div>
    </div>
  </div>

  <div class="group">
    <div class="row"><span class="label">原文语言</span><select id="source-lang" class="lang-select"></select></div>
    <div class="row"><span class="label">目标语言</span><select id="target-lang" class="lang-select"></select></div>
  </div>

  <div class="group">
    <div class="row"><span class="label">翻译服务</span><select id="provider-select" class="lang-select"></select><a href="#" id="provider-empty" class="link" hidden>未配置，点击前往设置</a></div>
    <div class="row" id="model-row"><span class="label">模型</span><select id="model-select" class="lang-select"></select></div>
    <div class="row">
      <span>在此站点启用</span>
      <label class="switch"><input type="checkbox" id="site-toggle" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <span>划词翻译</span>
      <label class="switch"><input type="checkbox" id="sel-toggle" checked><span class="slider"></span></label>
    </div>
  </div>

  <div id="estimate"></div>
  <div id="progress"></div>
  <div id="message"></div>

  <div class="action-wrap">
    <button id="action">翻译本页</button>
  </div>

  <div class="chips">
    <button class="chip" id="clear">✕ 清除本页译文</button>
  </div>

  <div class="footer">
    <a href="#" id="open-options">⚙ 设置</a>
    <span id="version"></span>
    <span></span>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
